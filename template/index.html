<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revertir Cadena</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f0f0f0;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    input, button {
      padding: 0.5rem;
      margin-top: 1rem;
      font-size: 1rem;
    }
    #resultado {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Revertir Cadena</h1>
    <input type="text" id="texto" placeholder="Escribe una cadena">
    <br>
    <button onclick="revertirCadena()">Aceptar</button>
    <p id="resultado"></p>
  </div>

  <script>
    function revertirCadena() {
      const texto = document.getElementById("texto").value;
      const reverso = texto.split("").reverse().join("");
      document.getElementById("resultado").textContent = `Cadena invertida: ${reverso}`;
    }
  </script>
</body>
</html>
